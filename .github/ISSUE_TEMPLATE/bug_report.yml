name: Bug report
description: Something behaves differently from what the documentation says
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Do not paste a real Admin API key, hostname, or production
        configuration.** Use synthetic values. If a real credential has already
        been exposed somewhere, rotate it first.

        For a security vulnerability, do not open an issue — see
        [SECURITY.md](../blob/main/SECURITY.md).

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you expect, and what happened instead?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: Commands and a minimal resource file, with synthetic values.
      render: shell
    validations:
      required: true

  - type: input
    id: sixsync-version
    attributes:
      label: SixSync version
      description: Output of `sixsync version`
    validations:
      required: true

  - type: input
    id: apisix-version
    attributes:
      label: APISIX version
      description: What `sixsync doctor` reports, or the image tag you run
    validations:
      required: true

  - type: textarea
    id: doctor
    attributes:
      label: sixsync doctor output
      description: Optional, and it contains no credentials by design.
      render: shell
