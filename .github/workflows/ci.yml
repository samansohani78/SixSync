# Continuous integration for SixSync.
#
# Every action is pinned to a full commit SHA. A tag is mutable: whoever can
# move it can change what runs here, which is exactly how the tj-actions
# supply-chain compromise reached tens of thousands of repositories. The
# trailing comment records which release each SHA corresponds to.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# The default token needs nothing beyond reading the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.27.0"

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      - name: Verify formatting
        run: |
          unformatted=$(gofmt -l . | grep -v '^third_party/' || true)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      - name: Build
        run: go build -trimpath ./...

      # The integration suite needs a live APISIX and is excluded from the
      # default build, so confirm it at least still compiles.
      - name: Type-check the integration suite
        run: go vet -tags integration ./test/...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - uses: golangci/golangci-lint-action@d583c34f0599d37dbac4a198b9c83201be380893 # v9.3.0
        with:
          version: latest

  vulncheck:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  integration:
    name: Integration against APISIX ${{ matrix.apisix }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Exact versions only. A floating tag would make a green run
        # meaningless, because it would not say what it was green against.
        apisix: ["3.18.0"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Start a disposable APISIX
        run: make env-up

      - name: Seed synthetic resources
        run: ./scripts/seed-test-gateway.sh

      - name: Run integration tests
        run: make test-integration

      - name: Tear down
        if: always()
        run: make env-down
