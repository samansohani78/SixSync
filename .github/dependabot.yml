# Dependency updates.
#
# Actions are pinned by commit SHA, and Dependabot updates the SHA while
# keeping the version comment in step — which is why SHA-pinning does not mean
# going stale.
version: 2
updates:
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      # One pull request for routine updates; a security fix still comes on
      # its own so it is not buried.
      all:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(ci)"
