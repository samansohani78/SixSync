# Disposable local APISIX for SixSync integration tests.
#
# NOT A PRODUCTION CONFIGURATION. The keys below are published test values
# with no secrecy whatsoever, and allow_admin is wide open. This stack is
# expected to be reachable only from the local Docker network.
apisix:
  node_listen: 9080
  enable_admin: true

deployment:
  role: traditional
  role_traditional:
    config_provider: etcd

  admin:
    allow_admin:
      - 0.0.0.0/0
    admin_listen:
      ip: 0.0.0.0
      port: 9180
    # Deliberately NOT setting admin_api_version, so that this stack exercises
    # whatever the shipped default response format is. That is the behaviour
    # real users get, and it is what SixSync must handle.
    admin_key:
      - name: admin
        key: sixsync-test-admin-key-not-secret
        role: admin
      - name: viewer
        key: sixsync-test-viewer-key-not-secret
        role: viewer

  etcd:
    host:
      - "http://etcd:2379"
    prefix: /apisix
    timeout: 30
