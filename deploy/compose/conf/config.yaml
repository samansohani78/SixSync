# Disposable local APISIX for SixSync integration tests.
#
# NOT A PRODUCTION CONFIGURATION. The keys below are published test values with
# no secrecy whatsoever, and the admin allowlist is wide open. Every listener
# binds to loopback.
#
# Ports come from the environment so one template serves every version under
# test; APISIX expands ${{VAR}} itself.
apisix:
  node_listen: ${{PROXY_PORT}}
  # The control API binds a port of its own. Under host networking it must be
  # parameterised too, or two versions cannot run side by side.
  enable_control: true
  control:
    ip: 127.0.0.1
    port: ${{CONTROL_PORT}}

deployment:
  role: traditional
  role_traditional:
    config_provider: etcd

  admin:
    allow_admin:
      - 127.0.0.0/24
    admin_listen:
      ip: 127.0.0.1
      port: ${{ADMIN_PORT}}
    # admin_api_version is deliberately unset, so the stack exercises whatever
    # the shipped default response format is. That is what real users get.
    admin_key:
      - name: admin
        key: sixsync-test-admin-key-not-secret
        role: admin
      - name: viewer
        key: sixsync-test-viewer-key-not-secret
        role: viewer

  etcd:
    host:
      - "http://127.0.0.1:${{ETCD_PORT}}"
    prefix: /apisix
    timeout: 30
