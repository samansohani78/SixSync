# Disposable APISIX stack for SixSync integration tests.
#
# Every image is pinned to an exact version. A floating tag such as `latest`
# would make compatibility results meaningless: a green test run has to name
# the exact APISIX build it was green against.
services:
  etcd:
    image: quay.io/coreos/etcd:v3.5.33
    container_name: sixsync-etcd
    # Flags are passed explicitly rather than through ETCD_* environment
    # variables: with an overridden command the image does not reliably apply
    # them, and etcd then binds to loopback only, which APISIX cannot reach.
    command:
      - /usr/local/bin/etcd
      - --name=sixsync-etcd
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd:2379
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 2s
      timeout: 3s
      retries: 30

  apisix:
    image: apache/apisix:3.18.0-debian
    container_name: sixsync-apisix
    depends_on:
      etcd:
        condition: service_healthy
    volumes:
      - ./conf/config.yaml:/usr/local/apisix/conf/config.yaml:ro
    ports:
      # Bound to loopback only: this stack has a wide-open admin allowlist and
      # must never be reachable from outside this machine.
      - "127.0.0.1:9180:9180"
      - "127.0.0.1:9080:9080"
